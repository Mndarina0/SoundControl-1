
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#00152e,#0754a8,#00152e);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: 90%;
    max-width: 500px;
    padding: 30px;
    text-align: center;
    background: rgba(0,15,40,.8);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 25px;
    box-shadow: 0 0 35px rgba(0,150,255,.35);
}

h1 {
    font-size: 32px;
    letter-spacing: 3px;
}

.subtitle {
    color: #a9d8ff;
    margin-bottom: 30px;
}

.main-button {
    width: 100%;
    padding: 22px;
    border: 1px solid #42b5ff;
    border-radius: 15px;
    background: linear-gradient(135deg,#0876d1,#003d83);
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.main-button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 25px #168dff;
}

.controls {
    display: none;
    margin-top: 25px;
    gap: 15px;
    flex-direction: column;
}

.control-button {
    padding: 18px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #087d38;
}

.stop {
    background: #b60020;
}

.volume-box {
    margin-top: 30px;
    padding: 18px;
    background: rgba(255,255,255,.07);
    border-radius: 15px;
}

.volume-box label {
    display: block;
    margin-bottom: 15px;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
    accent-color: #21a5ff;
}

#volumeValue {
    color: #55bdff;
    font-weight: bold;
}

.warning {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #080808;
    color: white;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.warning-content {
    max-width: 600px;
}

.warning-icon {
    color: red;
    font-size: 100px;
}

.warning h1 {
    color: red;
    font-size: 45px;
}

.warning h2 {
    color: #ff3333;
    letter-spacing: 4px;
}

.warning p {
    color: #ddd;
    line-height: 1.7;
    font-size: 17px;
}

.close-button {
    display: none;
    margin-top: 25px;
    padding: 15px 45px;
    border: 1px solid red;
    border-radius: 10px;
    background: #b00020;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

footer {
    margin-top: 25px;
    color: #8ebce5;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>SOUND CONTROL</h1>
    <p class="subtitle">Advanced Audio Control System</p>

    <button class="main-button" id="openButton">
        OPEN CONTROL
    </button>

    <div class="controls" id="controls">

        <button class="control-button start" id="startButton">
            ▶ START
        </button>

        <button class="control-button stop" id="stopButton">
            ■ STOP
        </button>

    </div>

    <div class="volume-box">
        <label>
            VOLUME: <span id="volumeValue">100%</span>
        </label>

        <input
            type="range"
            id="volumeSlider"
            min="100"
            max="200"
            value="100"
            step="1"
        >
    </div>

    <footer>SOUND CONTROL SYSTEM © 2026</footer>

</div>

<div class="warning" id="warning">

    <div class="warning-content">

        <div class="warning-icon">⚠</div>

        <h1>WARNING</h1>

        <h2>EXTREME CAUTION</h2>

        <p>
            THE SYSTEM HAS BEEN STOPPED.
            <br>
            PLEASE WAIT BEFORE CLOSING THIS SCREEN.
        </p>

        <button class="close-button" id="closeButton">
            CLOSE
        </button>

    </div>

</div>

<audio id="audio" preload="auto"></audio>

<script>


const audio = document.getElementById("audio");

const sounds = {
    welcome: "welcome.mp3",
    start: "start.mp3",
    stop: "STOP.mp3"
};

const openButton = document.getElementById("openButton");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const controls = document.getElementById("controls");
const warning = document.getElementById("warning");
const closeButton = document.getElementById("closeButton");
const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");

let audioContext = null;
let gainNode = null;
let sourceNode = null;
let welcomePlayed = false;
let warningTimer = null;

// Initialize audio and WAIT until it is running
async function setupAudio() {
    if (!audioContext) {
        const AudioClass =
            window.AudioContext || window.webkitAudioContext;

        if (AudioClass) {
            audioContext = new AudioClass();

            sourceNode = audioContext.createMediaElementSource(audio);
            gainNode = audioContext.createGain();

            sourceNode.connect(gainNode);
            gainNode.connect(audioContext.destination);
        }
    }

    if (audioContext && audioContext.state !== "running") {
        await audioContext.resume();
    }

    updateVolume();
}

// Volume control
function updateVolume() {
    const volume = Number(volumeSlider.value);
    volumeValue.textContent = volume + "%";

    if (gainNode) {
        gainNode.gain.value = volume / 100;
    } else {
        audio.volume = Math.min(volume / 100, 1);
    }
}

volumeSlider.addEventListener("input", updateVolume);

// Play audio
async function playSound(file) {
    try {
        await setupAudio();

        audio.pause();
        audio.currentTime = 0;

        audio.src = new URL(file, document.baseURI).href;
        audio.load();

        await audio.play();

        return true;

    } catch (error) {
        console.error("Audio playback failed:", error);
        alert("Sound error: " + error.message);
        return false;
    }
}

// Welcome sound: first user interaction
async function playWelcome() {
    if (welcomePlayed) return;

    const success = await playSound(sounds.welcome);

    if (success) {
        welcomePlayed = true;
    }
}

// Open controls
openButton.addEventListener("click", async () => {
    await setupAudio();

    controls.style.display = "flex";
    openButton.style.display = "none";

    if (!welcomePlayed) {
        await playWelcome();
    }
});

// START
startButton.addEventListener("click", async () => {
    warning.style.display = "none";
    await playSound(sounds.start);
});

// STOP
stopButton.addEventListener("click", async () => {
    await playSound(sounds.stop);

    warning.style.display = "flex";
    closeButton.style.display = "none";

    clearTimeout(warningTimer);

    warningTimer = setTimeout(() => {
        closeButton.style.display = "inline-block";
    }, 20000);
});

// CLOSE
closeButton.addEventListener("click", () => {
    clearTimeout(warningTimer);

    audio.pause();
    audio.currentTime = 0;

    warning.style.display = "none";
    closeButton.style.display = "none";

    controls.style.display = "none";
    openButton.style.display = "block";
});

</script>

</body>
</html>
